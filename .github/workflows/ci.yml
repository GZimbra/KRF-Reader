name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # SQL Server Express descartável: a suíte de persistência roda também contra ele (KRF_TEST_SQLSERVER).
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Express
          MSSQL_SA_PASSWORD: Krf_Ci_Only_2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Krf_Ci_Only_2026!' -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s --health-timeout 5s --health-retries 12
    env:
      KRF_TEST_SQLSERVER: Server=localhost,1433;User Id=sa;Password=Krf_Ci_Only_2026!;TrustServerCertificate=True
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build KrfReader.sln -c Release
      - run: dotnet test KrfReader.sln -c Release --no-build
